# Nous-approved MCP catalog entry. Approval requires merged PR review.
manifest_version: 1

name: blender
description: >-
  Create and inspect Blender scenes through a local community MCP bridge.
source: https://github.com/ahujasid/mcp-for-blender

# ahujasid/blender-mcp was renamed to mcp-for-blender. Use the real package,
# not blender-mcp 2.x (a compatibility wrapper with a floating dependency).
# Reviewed release metadata: https://pypi.org/pypi/mcp-for-blender/2.0.0/json
# MIT license; see README.md beside this manifest for the release audit.
transport:
  type: stdio
  command: uvx
  args:
    - --from
    - mcp-for-blender==2.0.0
    - mcp-for-blender
  version: "2.0.0"
  env:
    BLENDER_HOST: "127.0.0.1"
    BLENDER_PORT: "9876"
    BLENDER_MCP_SAFE_MODE: "1"
    # Add-on consent alone still allows anonymous counts. This disables all
    # outbound telemetry, including startup events and trajectory uploads.
    DISABLE_TELEMETRY: "true"

auth:
  type: none

# Keep external asset downloads, paid generation, and feedback tools opt-in.
tools:
  default_enabled:
    - get_addon_status
    - disable_telemetry
    - get_scene_info
    - get_object_info
    - get_viewport_screenshot
    - execute_blender_code
    - describe_node_type
    - bpy_api_lookup

# App detection is on the Hermes backend host, not necessarily the desktop.
# Presence qualifies suggestions, but does not prove add-on readiness.
suggest:
  keywords:
    - blender
    - 3d modeling
    - 3d modelling
  hosts:
    - blender.org
    - mcp-for-blender.com
  applications:
    - Blender
  requires_app: true
  examples:
    - Build a low-poly scene in Blender
    - Light a product render in Blender
    - Apply materials to a Blender model

post_install: |
  This entry configures the MCP bridge only. It does not install Blender,
  install or enable its add-on, launch Blender, or prove the scene is reachable.
  Requires uv/uvx, Python 3.10+, and Blender 3.0+ on the Hermes backend host.

  Before using Blender tools:
    1. Save your scene. Install the add-on bundled with the pinned release:
       uvx --from mcp-for-blender==2.0.0 mcp-for-blender install-addon
       To inspect destinations first, replace install-addon with addon-paths.
    2. In Blender, Edit > Preferences > Add-ons, enable "Interface: MCP for
       Blender". Uncheck "Allow Telemetry" and save preferences. This add-on
       defaults to telemetry consent ON; keep the bridge's DISABLE_TELEMETRY
       setting too, because the checkbox alone does not stop anonymous counts.
    3. In the 3D viewport, N > MCP for Blender, check the server is running
       on localhost:9876; click "Start MCP Server" if needed. The add-on can
       auto-start when enabled. Keep the socket local: it has no authentication.
    4. Before use, disable server-initiated model requests with:
       hermes config set mcp_servers.blender.sampling.enabled false
    5. Start a new Hermes session, then call get_addon_status and get_scene_info
       to verify the live add-on and scene. MCP tool discovery alone is not
       proof that Blender is connected. If the add-on was replaced, re-enable
       it or restart Blender before checking.

  Safe mode validates generated scripts; it is not a sandbox around Blender
  or its socket. Modeling, rendering, saving and import/export can still change
  local files. Keep external asset/generation integrations off unless requested;
  their accounts, permissions and possible charges are separate prerequisites.
  To revisit the tool selection: hermes mcp configure blender
